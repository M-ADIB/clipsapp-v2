name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: clipsos-hub

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # NOTE: `bun install` resolves against the registry pinned in the lockfile.
      # If the project's private registry is not reachable from CI, configure
      # its auth via repo secrets (or repoint the lockfile at public npm).
      # Non-frozen so the test-only devDeps reconcile against whatever registry
      # CI uses.
      - name: Install dependencies
        run: bun install

      # TEMPORARILY non-blocking: the repo has a large backlog of pre-existing
      # prettier/formatting violations (lint was never enforced). Run a
      # `bun run format` pass, then remove `continue-on-error` to gate on it.
      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test src/

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PROJECT_ID: example
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_SUPABASE_ANON_KEY: ci_placeholder
